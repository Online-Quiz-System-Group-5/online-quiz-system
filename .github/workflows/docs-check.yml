name: SRS document integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-srs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate SRS DOCX package and required identifiers
        run: python3 scripts/check_docs.py
      - name: Test SRS document validator
        run: python3 -m unittest tests/test_check_docs.py
