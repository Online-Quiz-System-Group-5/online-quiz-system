
name: C++ build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude src/main.cpp src/quiz.cpp -o online_quiz

      - name: Build test executable
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/quiz_tests.cpp src/quiz.cpp -o quiz_tests

      - name: Run C++ tests
        run: ./quiz_tests

      - name: Run CLI integration tests
        run: bash tests/cli_tests.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install web test dependencies
        run: npm ci

      - name: Run web UI unit tests
        run: npm run test:unit

      - name: Install Chrome, Edge, and Firefox
        run: npx playwright install --with-deps chrome msedge firefox

      - name: Run cross-browser integration tests
        run: npm run test:browser
        env:
          CI: true
